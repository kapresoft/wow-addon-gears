package-as: Gears
# --------------------------
enable-nolib-creation: no
enable-toc-creation: no
# --------------------------
license-output: LICENSE.txt

manual-changelog:
  filename: CHANGELOG.txt
  markup-type: markdown

required-dependencies:
  - LibIconPicker

embedded-libraries:
  - LibPrettyPrint
  - LibStub
  - Ace3
  - LibSharedMedia-3-0

tools-used:
  - DevSuite
  - DebugChatFrame
  - Addon-Usage
  - Bugsack
  - Bug-Grabber

externals:
  Gears/ThirdParty/Libs/LibStub: https://repos.wowace.com/wow/libstub/trunk
  Gears/ThirdParty/Libs/LibPrettyPrint: https://github.com/kapresoft/wow-addon-LibPrettyPrint
  Gears/ThirdParty/Libs/Ace3: https://github.com/WoWUIDev/Ace3
  Gears/ThirdParty/Libs/LibSharedMedia/LibSharedMedia-3.0: https://repos.wowace.com/wow/libsharedmedia-3-0/trunk/LibSharedMedia-3.0
  Gears/ThirdParty/Libs/Kapresoft-LibUtil: https://github.com/kapresoft/wow-lib-util

ignore:
  - README.md
  - doc
  - dev
  - pkgmeta.yaml
  - Gears/ThirdParty/Libs/LibStub/tests
  - Gears/ThirdParty/Libs/Ace3/Ace3.lua
  - Gears/ThirdParty/Libs/Ace3/Ace3.toc
  - Gears/ThirdParty/Libs/Ace3/tests
  - Gears/ThirdParty/Libs/Ace3/Bindings.xml
  - Gears/ThirdParty/Libs/Ace3/README.md
  - Gears/ThirdParty/Libs/LibPrettyPrint/dev
  - Gears/ThirdParty/Libs/LibPrettyPrint/doc
  - Gears/ThirdParty/Libs/LibPrettyPrint/Developer
  - Gears/ThirdParty/Libs/LibPrettyPrint/*.toc
  - Gears/ThirdParty/Libs/LibPrettyPrint/*.md
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/dev
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/External
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/_Lib.xml
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/*.toc
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/*.sh
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/*.yaml
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/*.md
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/*.md
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/AceConfigUtil.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/AddonInfoUtil.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/AddonUtil.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/ColorFormatter.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/ConsoleHelperMixin.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/DebugChatFrameMixin.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/LuaEvaluator.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/ModuleUtil.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/SequenceMixin.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/TimeUtil.lua
  - Gears-OptionsUI
### Ignore Gears-OptionsUI for now

# REQUIRED for CurseForge packager (non-obvious):
# The LEFT side MUST be <repo-folder>/<addon-folder>
#   - <addon-folder> MUST be the folder that contains the .toc files
# The RIGHT side MUST be the addon name:
#   - Must match the .toc filename (AddonName.toc)
#   - Must match `package-as`
#
# NOTE:
# CurseForge release.sh (poorly) relies on `move-folders` for *addon discovery*,
# not just post-processing. If this does not exactly match
# <repo>/<addon>, `toc_root_paths` will be empty and packaging WILL fail.
#
# ⚠️ Do not change unless you also change the repo/addon layout.
move-folders:
  Gears/Gears: Gears
  Gears/Gears-OptionsUI: Gears-OptionsUI
