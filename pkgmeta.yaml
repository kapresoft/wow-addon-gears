package-as: Gears
# --------------------------
enable-nolib-creation: no
enable-toc-creation: no
# --------------------------

manual-changelog:
  filename: dev/changelog-release.md
  markup-type: markdown

required-dependencies:
  - LibIconPicker

embedded-libraries:
  - LibStub
  - Ace3
  - LibPrettyPrint
  - LibTraceKit
  - LibUtil

tools-used:
  - DevSuite
  - DebugChatFrame
  - Bugsack
  - Bug-Grabber

externals:
  Gears/ThirdParty/Libs/Ace3:
    url: https://github.com/WoWUIDev/Ace3
    tag: latest
  Gears/ThirdParty/Libs/LibPrettyPrint:
    url: https://github.com/kapresoft/wow-addon-LibPrettyPrint
    tag: latest
  Gears/ThirdParty/Libs/LibTraceKit:
    url: https://github.com/kapresoft/wow-addon-LibTraceKit
    tag: latest
  Gears/ThirdParty/Libs/Kapresoft-LibUtil:
