  - Gears/ThirdParty/Libs/LibPrettyPrint/Developer
  - Gears/ThirdParty/Libs/LibPrettyPrint/*.toc
  - Gears/ThirdParty/Libs/LibPrettyPrint/*.md
  - Gears/ThirdParty/Libs/LibTraceKit/dev
  - Gears/ThirdParty/Libs/LibTraceKit/*.toc
  - Gears/ThirdParty/Libs/LibTraceKit/*.md
  - Gears/ThirdParty/Libs/LibTraceKit/Libs/Assets
  - Gears/ThirdParty/Libs/LibTraceKit/Libs/Developer.lua
  - Gears/ThirdParty/Libs/LibTraceKit/ThirdParty
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/dev
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/*.md
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/*.yaml
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/*.sh
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-1-0
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/*.toc
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/LibUtil.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/LibUtil.xml
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/Assets
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/ThirdParty
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/Modules/Annotations
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/Modules/AceConfigUtil.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/Modules/DebugChatFrameMixin.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/Modules/LuaEvaluator.lua
  - Gears/ThirdParty/Libs/Kapresoft-LibUtil/Lib-2-0/Modules/ModuleUtil.lua
