# This is used for development to pull external libraries.
# @see also: ./dev/pull-extlib.sh

# --------------------------
package-as: Pull-Ext-Lib
manual-changelog: false

# Files and directories beginning with a dot (such as .git) are automatically ignored, as is the pgkmeta file itself.
#ignore:
#  - .git
#  - .idea

externals:
  Gears_ExtLib/Kapresoft-LibUtil: https://github.com/kapresoft/wow-lib-util
  Gears_ExtLib/WowAce/Ace3: https://repos.wowace.com/wow/ace3/trunk
  Gears_ExtLib/WowAce/LibSharedMedia/LibSharedMedia-3.0: https://repos.wowace.com/wow/libsharedmedia-3-0/trunk/LibSharedMedia-3.0

ignore:
  - "*.sh"
  - "*.md"
  - "*.yaml"
  - "*.yml"
  - "*.toc"
  - dev
  - doc
  - scripts
  - Interface
  - Gears/CHANGELOG.md
  - Gears/LICENSE
  - Gears/Core
  - Gears/CoreV2-1
  - Gears/Bindings.xml
  - Gears_ExtLib/Kapresoft-LibUtil/External
  - Gears_ExtLib/Kapresoft-LibUtil/LICENSE
  - Gears_ExtLib/Kapresoft-LibUtil/dev
  - Gears_ExtLib/Kapresoft-LibUtil/doc
  - Gears_ExtLib/WowAce/Ace3/Ace3.lua
  - Gears_ExtLib/WowAce/Ace3/Bindings.xml
  - Gears_ExtLib/WowAce/Ace3/changelog.txt
  - Gears_ExtLib/WowAce/Ace3/LICENSE.txt
move-folders:
  Pull-Ext-Lib/Gears_ExtLib: ../Gears/External/Lib
